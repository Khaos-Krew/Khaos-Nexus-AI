name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Discord contracts
        run: node --test tests/discord-bridge.test.js
      - name: Validate Discord adapters
        run: node --test tests/discord-adapters.test.js
      - name: Validate Discord HTTP bridge
        run: node --test tests/discord-api.test.js
      - name: Validate Discord migrations
        run: node --test tests/discord-migration.test.js
      - name: Run full test suite
        run: npm test
      - run: npm run build
