name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Validate launch configuration and network hardening
        run: npm run test:launch
      - name: Validate Khaos Nexus desktop integration client
        run: npm run test:integration
      - name: Validate production startup and health
        run: npm run smoke:production
      - name: Validate Discord command discovery
        run: node --test --test-name-pattern="command discovery" tests/discord-bridge.test.js
      - name: Validate Discord binding contracts
        run: node --test --test-name-pattern="bindings accept" tests/discord-bridge.test.js
      - name: Validate Discord base command contracts
        run: node --test --test-name-pattern="valid snowflakes" tests/discord-bridge.test.js
      - name: Validate Discord retrieval command contract
        run: node --test --test-name-pattern="retrieval queries" tests/discord-bridge.test.js
      - name: Validate Discord adapters
        run: node --test tests/discord-adapters.test.js
      - name: Validate Discord HTTP bridge
        run: node --test tests/discord-api.test.js
      - name: Validate Discord migrations
        run: node --test tests/discord-migration.test.js
      - name: Validate retrieval contracts
        run: node --test tests/retrieval.test.js
      - name: Validate retrieval adapters
        run: node --test tests/retrieval-store.test.js
      - name: Validate retrieval HTTP API
        run: node --test tests/retrieval-api.test.js
      - name: Validate retrieval Discord flow
        run: node --test tests/retrieval-discord.test.js
      - name: Validate retrieval migrations
        run: node --test tests/retrieval-migration.test.js
      - name: Validate advanced map scene contracts
        run: node --test tests/map-scenes.test.js
      - name: Validate advanced map scene persistence
        run: node --test tests/map-scene-store.test.js
      - name: Validate advanced map scene HTTP API
        run: node --test tests/map-scene-api.test.js
      - name: Validate advanced map scene Discord flow
        run: node --test tests/map-scene-discord.test.js
      - name: Validate advanced map scene migrations
        run: node --test tests/map-scene-migration.test.js
      - name: Validate Phase 8 evaluation suite
        run: node --test tests/evaluations.test.js
      - name: Validate Phase 8 production-control persistence
        run: node --test tests/production-control-store.test.js
      - name: Validate Phase 8 provider boundary
        run: node --test tests/production-controls.test.js
      - name: Validate Phase 8 HTTP API
        run: node --test tests/production-control-api.test.js
      - name: Validate Phase 8 database safeguards
        run: node --test tests/production-control-migration.test.js
      - name: Validate desktop Co-DM contract
        run: node --test tests/co-dm.test.js
      - name: Validate desktop Co-DM HTTP integration
        run: node --test tests/co-dm-api.test.js
      - name: Validate desktop Co-DM policy migration
        run: node --test tests/co-dm-migration.test.js
      - name: Run full test suite
        run: npm test
      - name: Validate syntax and runtime composition
        run: npm run build
      - name: Build production container
        run: docker build --tag khaos-nexus-ai:${{ github.sha }} .
